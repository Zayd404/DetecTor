[app]
name = "DetecTor"
version = "1.1.0"
environment = "development"
language = "id"

[web_recon]
enabled = true
timeout = 15
max_retries = 2
user_agent = "DetecTor/1.0"
require_authorization = true
allowed_domains = []

[people_osint]
enabled = true
public_sources_only = true
respect_rate_limits = true
collect_sensitive_data = false
private_location_tracking = false

[storage]
database = "database/detector.db"
cache_directory = "data/cache"

[reporting]
output_directory = "reports"
format = ["json", "txt"]

[logging]
level = "INFO"
output_directory = "logs"
